[project]
name = "echostatenetwork"
version = "0.1.0"
description = "Echo State Network reference implementation for MagriLab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.0",
    "jax>=0.4.0",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "scikit-optimize>=0.9",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "nbconvert>=7.0",
    "nbclient>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esn", "jax_esn"]
